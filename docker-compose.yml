# Services d'infrastructure : PostgreSQL + Mosquitto (MQTT).
# Le backend et le frontend se lancent avec npm (voir README) — ou ajoutez vos propres services ici.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

volumes:
  pgdata:
  mqttdata:
